<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BONSAI-EN · PRO</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F4F0E8; --card: #FDFAF4; --card2: #F0EBE1;
  --ink: #1C1814; --ink2: #3A342C; --ink3: #7A6E62; --ink4: #B0A89C;
  --moss: #3D6B47; --moss-l: #5A8E65; --moss-pale: #D4E4D8;
  --clay: #9B5B3A; --red: #C0392B; --red-pale: #FDECEA;
  --border: rgba(28,24,20,0.10); --shadow: 0 2px 16px rgba(28,24,20,0.07);
  --r: 18px; --r-sm: 12px;
  --font: 'DM Sans', sans-serif; --serif: 'Noto Serif JP', serif;
  --ease: cubic-bezier(0.4,0,0.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:82px;overflow-x:hidden}
.screen{display:none}
.screen.active{display:block;animation:fadeUp .28s var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* HEADER */
.app-header{background:rgba(253,250,244,.94);backdrop-filter:blur(18px);padding:14px 18px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200}
.logo{display:flex;align-items:center;gap:10px}
.logo-torii{color:var(--red);font-size:1.8rem}
.logo-text .name{font-family:var(--serif);font-size:1.15rem;font-weight:700;letter-spacing:.05em}
.logo-text .sub{font-size:.58rem;color:var(--ink3);letter-spacing:.22em;text-transform:uppercase}
.header-r{display:flex;align-items:center;gap:8px}
.count-pill{background:var(--ink);color:var(--bg);padding:4px 11px;border-radius:20px;font-size:.68rem;font-weight:600}
.icon-btn{width:36px;height:36px;border-radius:50%;background:var(--card2);border:none;display:flex;align-items:center;justify-content:center;color:var(--ink2);cursor:pointer}

/* LIST & GRID */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.list-view{display:flex;flex-direction:column;gap:10px;padding:16px}
.bonsai-card{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,0.05)}
.card-img{height:130px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:3rem;background-color:var(--card2)}

/* CROP MODULE */
#crop-screen{display:none;position:fixed;inset:0;background:#000;z-index:5000;flex-direction:column}
#crop-viewport{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none}
#crop-image{position:absolute;cursor:move;user-select:none;touch-action:none}
#crop-guide{width:300px;height:300px;border:2px solid #fff;box-shadow:0 0 0 2000px rgba(0,0,0,0.7);z-index:10;pointer-events:none;border-radius:var(--r-sm)}
.crop-bar{height:80px;background:var(--ink);display:flex;padding:15px;gap:10px}

/* UI ELEMENTS */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(253,250,244,.96);backdrop-filter:blur(20px);height:72px;display:flex;justify-content:space-around;align-items:center;border-top:1px solid var(--border);z-index:200}
.nav-btn{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink4);font-size:.58rem;text-transform:uppercase}
.nav-btn.active{color:var(--ink)}
.nav-btn.active i{color:var(--moss)}
.cta-btn{flex:1;padding:14px;border-radius:var(--r-sm);border:none;font-weight:600;font-family:var(--font);cursor:pointer}
.cta-primary{background:var(--bg);color:var(--ink)}
.cta-dark{background:var(--ink);color:var(--bg)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:20px;font-size:.8rem;opacity:0;transition:.3s;z-index:1000}
.toast.show{opacity:1}
</style>
</head>
<body>

<div id="screen-list" class="screen active">
  <header class="app-header">
    <div class="logo">
      <div class="logo-torii"><i class="fa-solid fa-torii-gate"></i></div>
      <div class="logo-text">
        <div class="name">BONSAI-EN</div>
        <div class="sub">Collection Pro</div>
      </div>
    </div>
    <div class="header-r">
      <div class="count-pill" id="bonsai-count">6 arbres</div>
      <button class="icon-btn" onclick="toggleView()"><i class="fa-solid fa-grip" id="view-icon"></i></button>
    </div>
  </header>

  <div id="list-container"></div>
</div>

<div id="crop-screen">
    <div id="crop-viewport">
        <img id="crop-image" src="">
        <div id="crop-guide"></div>
    </div>
    <div class="crop-bar">
        <button class="cta-btn cta-primary" onclick="closeCrop()">Annuler</button>
        <button class="cta-btn cta-dark" onclick="confirmCrop()">Valider le cadre</button>
    </div>
</div>

<nav class="bottom-nav">
  <button class="nav-btn active"><i class="fa-solid fa-seedling"></i><span>Collection</span></button>
  <button class="nav-btn" onclick="document.getElementById('file-input').click()"><i class="fa-solid fa-camera"></i><span>Photo</span></button>
  <button class="nav-btn" onclick="showToast('Calendrier bientôt prêt')"><i class="fa-regular fa-calendar"></i><span>Calendrier</span></button>
</nav>

<input type="file" id="file-input" style="display:none" accept="image/*" onchange="startCrop(this)">
<div class="toast" id="toast"></div>

<script>
const BONSAIS = [
  { id:1, emoji:'🌲', name:'Shōichi', species:'Juniperus chinensis', img:'' },
  { id:2, emoji:'🍁', name:'Momiji', species:'Acer palmatum', img:'' }
];

let isGridView = true;
let imgX = 0, imgY = 0, isDragging = false;
const cropImg = document.getElementById('crop-image');

// --- AFFICHAGE ---
function renderList() {
  const c = document.getElementById('list-container');
  c.className = isGridView ? 'grid' : 'list-view';
  c.innerHTML = BONSAIS.map(b => `
    <div class="bonsai-card">
      <div class="card-img" style="background-image:url(${b.img})">${b.img ? '' : b.emoji}</div>
      <div style="padding:12px">
        <div style="font-family:var(--serif); font-weight:600">${b.name}</div>
        <div style="font-size:.7rem; color:var(--ink3); font-style:italic">${b.species}</div>
      </div>
    </div>
  `).join('');
}

function toggleView() {
  isGridView = !isGridView;
  document.getElementById('view-icon').className = isGridView ? 'fa-solid fa-grip' : 'fa-solid fa-list';
  renderList();
}

// --- RECADRAGE PHOTO ---
cropImg.addEventListener('pointerdown', e => { isDragging = true; cropImg.setPointerCapture(e.pointerId); });
cropImg.addEventListener('pointermove', e => {
    if (!isDragging) return;
    imgX += e.movementX; imgY += e.movementY;
    cropImg.style.transform = `translate(${imgX}px, ${imgY}px)`;
});
cropImg.addEventListener('pointerup', () => isDragging = false);

function startCrop(input) {
    if (!input.files[0]) return;
    const reader = new FileReader();
    reader.onload = e => {
        cropImg.src = e.target.result;
        document.getElementById('crop-screen').style.display = 'flex';
        imgX = 0; imgY = 0; cropImg.style.transform = `translate(0,0)`;
    };
    reader.readAsDataURL(input.files[0]);
}

function closeCrop() { document.getElementById('crop-screen').style.display = 'none'; }

function confirmCrop() {
    // Ici, on capturerait normalement le canvas. Pour l'exemple, on applique l'image au premier bonsaï
    BONSAIS[0].img = cropImg.src; 
    renderList();
    closeCrop();
    showToast("Photo mise à jour !");
}

function showToast(m) {
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

window.onload = renderList;
</script>
</body>
</html>
