<!DOCTYPE html><html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BONSAI-EN PRO</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;600;700&display=swap" rel="stylesheet"><style>
body { font-family:'DM Sans',sans-serif; margin:0; background:#F2EFE8; }
header { padding:16px; font-weight:700; font-size:20px; background:white; }
.container { padding:12px; }

.card {
  background:white;
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
  cursor:pointer;
}

.badge { font-size:11px; padding:3px 8px; border-radius:20px; }
.green { background:#DFF0E4; color:#2E7A48; }
.red { background:#FADDDA; color:#9A3828; }

input, select {
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:8px;
  border:1px solid #ccc;
}

button {
  padding:12px;
  border:none;
  border-radius:10px;
  background:#2E2A24;
  color:white;
  font-weight:700;
  margin-top:10px;
  width:100%;
}

#calendar div {
  display:inline-block;
  width:14%;
  text-align:center;
  padding:8px 0;
}

.today { background:black; color:white; border-radius:50%; }
.task { background:#4A7A56; color:white; border-radius:50%; }
</style></head><body><header>BONSAI-EN 🌱</header><div class="container" id="list"></div><div class="container" id="editor" style="display:none">
  <input id="name" placeholder="Nom">
  <input id="species" placeholder="Espèce">  <select id="category">
    <option value="auto">Auto</option>
    <option value="conifer">Conifère</option>
    <option value="deciduous">Feuillu</option>
    <option value="other">Autre</option>
  </select>  <input type="date" id="lastWater">
  <input type="date" id="lastCut">  <input type="file" id="photo"><button onclick="save()">Enregistrer</button>
<button onclick="del()">Supprimer</button>
<button onclick="back()">Retour</button>

</div><div class="container" id="calendar" style="display:none"></div><script>
let db;
let currentId = null;
let bonsais = [];

const request = indexedDB.open("bonsaiDB", 1);

request.onupgradeneeded = e => {
  db = e.target.result;
  db.createObjectStore("trees", { keyPath: "id" });
};

request.onsuccess = e => {
  db = e.target.result;
  load();
};

function inferCategory(species){
  if(!species) return 'other';
  if(species.includes('Pinus') || species.includes('Juniperus')) return 'conifer';
  if(species.includes('Acer') || species.includes('Ulmus')) return 'deciduous';
  return 'other';
}

function load(){
  const tx = db.transaction("trees","readonly");
  const store = tx.objectStore("trees");
  const req = store.getAll();

  req.onsuccess = () => {
    bonsais = req.result;
    renderList();
    renderCalendar();
  };
}

function renderList(){
  const list = document.getElementById("list");
  list.innerHTML = "";

  bonsais.forEach(b => {
    const div = document.createElement("div");
    div.className = "card";

    const urgent = isUrgent(b);

    div.innerHTML = `
      <b>${b.name}</b><br>
      ${b.species}<br>
      <span class="badge ${urgent?'red':'green'}">
        ${urgent?'À faire':'OK'}
      </span>
    `;

    div.onclick = () => edit(b);
    list.appendChild(div);
  });

  const add = document.createElement("button");
  add.textContent = "+ Ajouter";
  add.onclick = () => edit(null);
  list.appendChild(add);

  const cal = document.createElement("button");
  cal.textContent = "📅 Calendrier";
  cal.onclick = () => showCalendar();
  list.appendChild(cal);
}

function isUrgent(b){
  if(!b.lastWater) return true;

  const last = new Date(b.lastWater);
  const now = new Date();

  const diff = (now - last) / (1000*60*60*24);
  return diff > 5;
}

function edit(b){
  list.style.display="none";
  calendar.style.display="none";
  editor.style.display="block";

  if(b){
    currentId = b.id;
    name.value = b.name;
    species.value = b.species;
    category.value = b.category || 'auto';
    lastWater.value = b.lastWater || '';
    lastCut.value = b.lastCut || '';
  } else {
    currentId = null;
    name.value = '';
    species.value = '';
    category.value = 'auto';
    lastWater.value = '';
    lastCut.value = '';
  }
}

function save(){
  let cat = category.value;
  if(cat === 'auto') cat = inferCategory(species.value);

  const reader = new FileReader();

  const saveData = (photo) => {
    const tx = db.transaction("trees","readwrite");
    const store = tx.objectStore("trees");

    store.put({
      id: currentId || Date.now(),
      name: name.value,
      species: species.value,
      category: cat,
      lastWater: lastWater.value,
      lastCut: lastCut.value,
      photo: photo
    });

    back();
    load();
  };

  if(photo.files[0]){
    reader.onload = e => saveData(e.target.result);
    reader.readAsDataURL(photo.files[0]);
  } else {
    saveData(null);
  }
}

function del(){
  if(!currentId) return;
  if(!confirm("Supprimer cet arbre ?")) return;

  const tx = db.transaction("trees","readwrite");
  tx.objectStore("trees").delete(currentId);

  back();
  load();
}

function back(){
  editor.style.display="none";
  calendar.style.display="none";
  list.style.display="block";
}

function showCalendar(){
  list.style.display="none";
  editor.style.display="none";
  calendar.style.display="block";
}

function renderCalendar(){
  const cal = document.getElementById("calendar");
  cal.innerHTML = "";

  const today = new Date();
  const days = new Date(today.getFullYear(), today.getMonth()+1, 0).getDate();

  for(let i=1;i<=days;i++){
    const d = document.createElement("div");
    d.textContent = i;

    const dateStr = today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,'0')+"-"+String(i).padStart(2,'0');

    if(i === today.getDate()) d.classList.add("today");

    if(hasTask(dateStr)) d.classList.add("task");

    cal.appendChild(d);
  }
}

function hasTask(date){
  return bonsais.some(b => {
    if(!b.lastWater) return false;
    const last = new Date(b.lastWater);
    const d = new Date(date);
    const diff = (d - last) / (1000*60*60*24);
    return diff >=5 && diff <=6;
  });
}
</script></body>
</html>
