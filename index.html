}
.dossier-icon { background: var(--sage-light); color: var(--sage); width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; flex-shrink: 0; }
.dossier-name { font-size: 0.88rem; font-weight: 600; color: var(--text); }
.dossier-sub { font-size: 0.63rem; color: var(--text-sec); margin-top: 1px; font-style: italic; }

/* ── SECTIONS / ID GRID ── */
.section { padding: 12px 14px 4px; }
.section-title { font-size: 0.88rem; font-weight: 700; color: var(--text); margin-bottom: 10px; font-family: var(--font-serif); }
.id-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.id-tile {
  background: var(--card); border-radius: var(--radius-sm); padding: 11px 13px;
  border: 1px solid var(--border); position: relative; box-shadow: var(--shadow-sm);
}
.id-tile.full { grid-column: span 2; }
.id-tile > label { display: block; font-size: 0.58rem; font-weight: 700; color: var(--sage); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
.id-tile input[type="text"], .id-tile input[type="date"], .id-tile select { width: 100%; border: none; background: transparent; font-family: var(--font); font-size: 0.86rem; color: var(--text); outline: none; padding: 0; }
.id-tile select option { background: #fff; }
.id-tile-icon { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); color: var(--text-ghost); font-size: 0.78rem; pointer-events: none; }

/* ── SPECIES MODAL ── */
.species-trigger { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
.species-trigger span { font-size: 0.86rem; color: var(--text-ghost); font-style: italic; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.species-trigger span.selected { color: var(--text); font-style: normal; }
.species-trigger i { font-size: 0.7rem; color: var(--text-dim); flex-shrink: 0; margin-left: 6px; }
.species-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 5000; background: rgba(44,40,32,0.4); flex-direction: column; backdrop-filter: blur(4px); }
.species-modal.open { display: flex; }
.species-panel {
  background: var(--card); border-radius: 0 0 24px 24px; width: 100%;
  max-height: 72vh; display: flex; flex-direction: column;
  border-bottom: 1px solid var(--border);
  box-shadow: 0 12px 40px rgba(44,40,32,0.18);
  animation: slideDown 0.22s ease;
}
@keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.species-panel-header { padding: 15px 16px 11px; border-bottom: 1px solid var(--border); flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; }
.species-panel-top { display: flex; align-items: center; justify-content: space-between; }
.species-panel-title { font-family: var(--font-serif); font-size: 1rem; font-weight: 700; color: var(--text); }
.species-close-btn { background: var(--card2); border: 1px solid var(--border); width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-sec); font-size: 0.75rem; flex-shrink: 0; }
.species-search-bar { display: flex; align-items: center; background: var(--bg2); border-radius: 12px; padding: 10px 14px; gap: 8px; border: 1px solid var(--border); }
.species-search-bar i { color: var(--text-dim); font-size: 0.85rem; }
.species-search-bar input { flex: 1; border: none; background: transparent; font-family: var(--font); font-size: 0.88rem; color: var(--text); outline: none; }
#species-list-container { overflow-y: auto; flex: 1 1 auto; min-height: 0; padding: 4px 0; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.species-group-header { padding: 8px 16px 4px; font-size: 0.59rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--sage); background: var(--sage-pale); position: sticky; top: 0; }
.species-item { padding: 12px 18px; font-size: 0.85rem; color: var(--text-sec); cursor: pointer; border-bottom: 1px solid var(--border); transition: background 0.1s; }
.species-item:active { background: var(--sage-light); color: var(--text); }
.species-empty { padding: 24px; text-align: center; color: var(--text-dim); font-size: 0.85rem; font-style: italic; }

/* ── AI BLOCK ── */
.ai-block {
  margin: 12px 14px 4px; background: var(--sage-pale);
  border-radius: var(--radius); padding: 14px 16px;
  border: 1px solid rgba(90,122,96,0.18);
}
.ai-top { display: flex; align-items: center; justify-content: space-between; }
.ai-top span { color: var(--sage); font-weight: 700; font-size: 0.82rem; display: flex; align-items: center; gap: 7px; }
.btn-ai { background: var(--sage); border: none; color: white; padding: 7px 16px; border-radius: 50px; font-size: 0.74rem; font-weight: 700; cursor: pointer; font-family: var(--font); box-shadow: 0 2px 10px rgba(90,122,96,0.25); }
.btn-ai:disabled { opacity: 0.6; cursor: not-allowed; }
#ai-output { background: rgba(255,255,255,0.8); color: var(--text-sec); font-size: 0.8rem; line-height: 1.75; border-radius: 10px; padding: 12px 14px; white-space: pre-wrap; display: none; margin-top: 10px; border: 1px solid var(--border); }
.ai-loading { display: flex; gap: 5px; align-items: center; padding: 4px 0; }
.ai-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--sage); animation: bounce 1.2s infinite; }
.ai-dot:nth-child(2) { animation-delay: 0.2s; }
.ai-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,80%,100%{transform:scale(1);opacity:0.45} 40%{transform:scale(1.35);opacity:1} }

/* ── NOTES BLOCK ── */
.notes-block { margin: 10px 14px 4px; background: var(--card); border-radius: var(--radius); padding: 14px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
.notes-block > label { font-size: 0.58rem; font-weight: 700; text-transform: uppercase; color: var(--sage); display: flex; align-items: center; gap: 6px; margin-bottom: 8px; letter-spacing: 0.06em; }
.notes-block textarea { width: 100%; border: 1px solid var(--border); border-radius: 10px; font-family: var(--font); font-size: 0.86rem; color: var(--text); outline: none; padding: 10px 12px; resize: none; background: var(--bg2); line-height: 1.65; }
.notes-block textarea:focus { border-color: var(--sage-mid); }
.notes-block textarea::placeholder { color: var(--text-ghost); }

/* ── GALLERY BLOCK ── */
.gallery-block { margin: 10px 14px 120px; background: var(--card); border-radius: var(--radius); padding: 14px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
.gallery-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.gallery-title { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; color: var(--sage); display: flex; align-items: center; gap: 6px; letter-spacing: 0.06em; }
.btn-add-gallery-photo { background: var(--sage-light); border: none; border-radius: 50px; padding: 6px 14px; font-family: var(--font); font-size: 0.7rem; font-weight: 700; color: var(--sage); cursor: pointer; display: flex; align-items: center; gap: 5px; }
.gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.gallery-thumb { aspect-ratio: 1/1; border-radius: 10px; overflow: hidden; position: relative; cursor: pointer; background: var(--card2); }
.gallery-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gallery-thumb-date { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(44,40,32,0.65)); color: #fff; font-size: 0.5rem; font-weight: 700; padding: 10px 5px 4px; text-align: center; }
.gallery-thumb-del { position: absolute; top: 4px; right: 4px; background: rgba(44,40,32,0.45); color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 0.65rem; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.15s; }
.gallery-thumb:hover .gallery-thumb-del, .gallery-thumb:active .gallery-thumb-del { opacity: 1; }
.gallery-empty { grid-column: span 3; text-align: center; color: var(--text-dim); font-size: 0.78rem; padding: 18px 0; font-style: italic; }

/* ── GALLERY VIEWER ── */
#gallery-viewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(28,24,20,0.95); z-index: 4000; flex-direction: column; align-items: center; justify-content: center; }
#gallery-viewer.open { display: flex; }
#viewer-img { max-width: 96vw; max-height: 72vh; border-radius: 14px; object-fit: contain; box-shadow: 0 8px 50px rgba(0,0,0,0.5); }
.viewer-meta { margin-top: 16px; text-align: center; color: rgba(255,255,255,0.5); font-size: 0.78rem; }
.viewer-meta strong { color: #fff; font-family: var(--font-serif); font-size: 0.95rem; display: block; margin-bottom: 3px; }
.viewer-nav { display: flex; gap: 12px; margin-top: 16px; }
.btn-viewer { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 10px 18px; border-radius: 50px; font-family: var(--font); font-size: 0.78rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.btn-viewer-close { background: rgba(255,255,255,0.06); }
.btn-viewer-del { background: rgba(184,107,74,0.35); border-color: rgba(184,107,74,0.5); }
.viewer-counter { color: rgba(255,255,255,0.3); font-size: 0.7rem; margin-top: 8px; }

/* ── CALENDRIER ── */
.cal-header {
  background: rgba(250,248,243,0.97); padding: 15px 16px 12px;
  position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow-sm); display: flex; align-items: center; justify-content: space-between;
}
.cal-header-title { font-family: var(--font-serif); font-size: 1.45rem; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
.btn-add-task {
  background: var(--sage); border: none; border-radius: 50px; padding: 9px 18px;
  color: #fff; font-family: var(--font); font-size: 0.8rem; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  box-shadow: 0 3px 12px rgba(90,122,96,0.28);
}
.cal-month-nav { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; }
.cal-month-label { font-family: var(--font-serif); font-size: 1rem; font-weight: 700; color: var(--text); text-transform: capitalize; }
.btn-month { background: var(--card2); border: 1px solid var(--border); width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-sec); font-size: 0.8rem; transition: background 0.15s; }
.btn-month:active { background: var(--card3); }
.cal-grid-wrap { padding: 0 14px 10px; }
.cal-weekdays { display: grid; grid-template-columns: repeat(7,1fr); margin-bottom: 6px; }
.cal-weekday { text-align: center; font-size: 0.6rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; padding: 4px 0; letter-spacing: 0.04em; }
.cal-days { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }
.cal-day {
  aspect-ratio: 1/1; border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; position: relative; font-size: 0.82rem; font-weight: 500;
  color: var(--text); background: transparent; border: none; font-family: var(--font);
  transition: background 0.12s;
}
.cal-day:active { background: var(--card2); }
.cal-day.other-month { color: var(--text-ghost); }
.cal-day.today { background: var(--ink); color: #fff; font-weight: 700; }
.cal-day.selected { background: var(--sage); color: #fff; font-weight: 700; }
.cal-day.has-task::after { content: ''; position: absolute; bottom: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--sage); }
.cal-day.has-overdue::after { background: var(--urgent); }
.cal-day.today.has-task::after, .cal-day.selected.has-task::after { background: rgba(255,255,255,0.75); }
.cal-tasks-section { padding: 0 14px 80px; }
.cal-tasks-date { font-family: var(--font-serif); font-size: 0.9rem; font-weight: 700; color: var(--text); margin: 14px 0 10px; text-transform: capitalize; }
.cal-task-item {
  background: var(--card); border-radius: var(--radius-sm); padding: 12px 14px;
  display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow-sm);
  border: 1px solid var(--border); margin-bottom: 8px; position: relative;
}
.cal-task-item.is-overdue { border-color: rgba(192,64,48,0.3); background: var(--urgent-bg); }
.cal-task-color { width: 4px; height: 38px; border-radius: 3px; flex-shrink: 0; }
.cal-task-info { flex: 1; }
.cal-task-title { font-size: 0.88rem; font-weight: 700; color: var(--text); }
.cal-task-sub { font-size: 0.7rem; color: var(--text-sec); margin-top: 2px; }
.cal-task-del { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 0.85rem; padding: 4px; }
.cal-empty { text-align: center; color: var(--text-dim); font-size: 0.82rem; padding: 28px 0; font-style: italic; line-height: 1.6; }

/* ── TASK MODAL ── */
.task-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 5000; background: rgba(44,40,32,0.4); align-items: flex-end; backdrop-filter: blur(4px); }
.task-modal.open { display: flex; }
.task-panel {
  background: var(--bg); border-radius: 26px 26px 0 0; width: 100%;
  padding: 22px 18px 34px; border-top: 1px solid var(--border);
  max-height: 90vh; overflow-y: auto;
  box-shadow: 0 -8px 40px rgba(44,40,32,0.15);
}
.task-panel-title { font-family: var(--font-serif); font-size: 1.1rem; font-weight: 700; color: var(--text); margin-bottom: 16px; }
.task-field { margin-bottom: 13px; }
.task-field label { display: block; font-size: 0.6rem; font-weight: 700; color: var(--sage); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 5px; }
.task-field input, .task-field select { width: 100%; border: 1px solid var(--border); border-radius: 11px; padding: 11px 13px; font-family: var(--font); font-size: 0.88rem; color: var(--text); background: var(--card); outline: none; }
.task-field input:focus, .task-field select:focus { border-color: var(--sage-mid); }
.task-type-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
.task-type-btn {
  border: 1.5px solid var(--border); border-radius: 12px; padding: 11px 6px;
  background: var(--card); font-family: var(--font); font-size: 0.71rem; font-weight: 600;
  color: var(--text-sec); cursor: pointer; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 5px; transition: 0.15s;
}
.task-type-btn i { font-size: 1.1rem; }
.task-type-btn.selected { border-color: var(--sage); background: var(--sage-light); color: var(--sage); }
.task-type-btn.t-blue.selected  { border-color: #3A7A9A; background: #E4F2F8; color: #3A7A9A; }
.task-type-btn.t-red.selected   { border-color: var(--terra); background: var(--terra-light); color: var(--terra); }
.task-type-btn.t-amber.selected { border-color: #8A6020; background: var(--gold-light); color: #8A6020; }
.task-type-btn.t-green.selected { border-color: var(--sage); background: var(--sage-light); color: var(--sage); }
.task-type-btn.t-purple.selected{ border-color: #6A4A9A; background: #EEE8F8; color: #6A4A9A; }
.task-type-btn.t-violet.selected{ border-color: #7A4A9A; background: #F0E8F8; color: #7A4A9A; }
.task-type-btn.t-teal.selected  { border-color: #2A7A6A; background: #E0F4F0; color: #2A7A6A; }
.task-type-btn.t-rose.selected  { border-color: var(--sakura); background: var(--sakura-light); color: var(--sakura); }
.task-type-btn.t-olive.selected { border-color: #5A6A2A; background: #EEF0DC; color: #5A6A2A; }
.task-type-btn.t-gray.selected  { border-color: #5A5A6A; background: #EEEEF2; color: #5A5A6A; }
.btn-save-task {
  width: 100%; padding: 16px; border: none; border-radius: 50px;
  background: var(--sage); color: #fff; font-family: var(--font);
  font-size: 0.9rem; font-weight: 700; cursor: pointer; margin-top: 8px;
  box-shadow: 0 4px 16px rgba(90,122,96,0.28);
}
.recurrence-row { display: flex; gap: 8px; }
.recurrence-btn { flex: 1; padding: 10px 4px; border: 1.5px solid var(--border); border-radius: 11px; background: var(--card); font-family: var(--font); font-size: 0.68rem; font-weight: 600; color: var(--text-sec); cursor: pointer; text-align: center; transition: 0.15s; }
.recurrence-btn.selected { border-color: var(--sage); background: var(--sage-light); color: var(--sage); }

/* ── ANIMATIONS ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
.screen.active .home-header,
.screen.active .urgency-banner.show,
.screen.active .upcoming-widget,
.screen.active .search-wrap,
.screen.active .category-section { animation: fadeUp 0.3s ease both; }
.screen.active .category-section:nth-child(3) { animation-delay: 0.04s; }
.screen.active .category-section:nth-child(4) { animation-delay: 0.08s; }
.screen.active .category-section:nth-child(5) { animation-delay: 0.12s; }

/* ── CONSEILS ── */
.advice-header {
  background: rgba(250,248,243,0.97); padding: 15px 16px 12px;
  position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}
.advice-header-title { font-family: var(--font-serif); font-size: 1.45rem; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
.advice-header-sub { font-size: 0.7rem; color: var(--text-sec); margin-top: 2px; font-style: italic; letter-spacing: 0.02em; }
.advice-filters { display: flex; gap: 7px; padding: 12px 16px 8px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.advice-filters::-webkit-scrollbar { display: none; }
.advice-filter-btn { flex-shrink: 0; padding: 7px 15px; border-radius: 50px; border: 1.5px solid var(--border); background: var(--card); font-family: var(--font); font-size: 0.73rem; font-weight: 600; color: var(--text-sec); cursor: pointer; transition: 0.15s; white-space: nowrap; }
.advice-filter-btn.active { background: var(--sage); border-color: var(--sage); color: #fff; box-shadow: 0 2px 10px rgba(90,122,96,0.28); }
.advice-list { padding: 4px 16px 90px; display: flex; flex-direction: column; gap: 10px; }
.advice-section-label { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); padding: 10px 0 4px; display: flex; align-items: center; gap: 8px; }
.advice-section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.advice-card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow-card); cursor: pointer; overflow: hidden; transition: transform 0.15s, box-shadow 0.15s; animation: fadeUp 0.3s ease both; }
.advice-card:active { transform: scale(0.985); box-shadow: var(--shadow-sm); }
.advice-card-accent { height: 4px; width: 100%; }
.advice-card-body { padding: 14px 15px 13px; }
.advice-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.advice-card-left { flex: 1; min-width: 0; }
.advice-card-icon { width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 1.05rem; }
.advice-card-tag { font-size: 0.57rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 4px; }
.advice-card-title { font-family: var(--font-serif); font-size: 1rem; font-weight: 700; color: var(--text); line-height: 1.25; margin-bottom: 5px; }
.advice-card-subtitle { font-size: 0.62rem; font-style: italic; color: var(--text-dim); margin-bottom: 7px; font-family: var(--font-serif); }
.advice-card-desc { font-size: 0.78rem; color: var(--text-sec); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.advice-card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.advice-card-meta { display: flex; gap: 12px; }
.advice-card-badge { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 4px 9px; border-radius: 50px; background: var(--card2); color: var(--text-sec); border: 1px solid var(--border); }
.advice-card-arrow { color: var(--text-dim); font-size: 0.72rem; }
.advice-modal { display: none; position: fixed; inset: 0; background: rgba(44,40,32,0.5); z-index: 6000; align-items: flex-end; backdrop-filter: blur(5px); }
.advice-modal.open { display: flex; }
.advice-modal-panel { background: var(--bg); border-radius: 26px 26px 0 0; width: 100%; max-height: 88vh; overflow-y: auto; -webkit-overflow-scrolling: touch; border-top: 1px solid var(--border); box-shadow: 0 -8px 40px rgba(44,40,32,0.18); animation: slideUp 0.25s ease; padding-bottom: 34px; }
@keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.advice-modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 18px 14px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 10; }
