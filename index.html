<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bonsai Do - Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #B0D3E5; --primary-dark: #507A92; --primary-deep: #2E5F78;
            --bg: #D5D1C0; --card-bg2: #FDFBF4; --text: #2C2A23;
            --secondary-text: #6E6C62; --danger: #C0392B; --success: #27AE60;
            --radius: 14px; --shadow-card: 0 2px 12px rgba(0,0,0,0.08);
            --font-serif: 'Noto Serif JP', serif; --font-sans: 'DM Sans', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-sans); background: var(--bg); padding-bottom: 80px; color: var(--text); min-height: 100vh; }

        .app-header { background: linear-gradient(135deg, var(--primary-deep), var(--primary-dark)); color: #fff; padding: 14px 16px; position: sticky; top: 0; z-index: 100; box-shadow: 0 3px 16px rgba(0,0,0,0.1); }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .header-title { font-family: var(--font-serif); font-size: 1.5rem; font-weight: 600; }

        .main-container { padding: 14px; max-width: 800px; margin: 0 auto; }
        #list-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 12px; }
        
        .bonsai-item { background: var(--card-bg2); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-card); cursor: pointer; display: flex; flex-direction: column; }
        .thumb-icon { width: 100%; height: 150px; background-color: #E8E4D8; background-size: contain; background-repeat: no-repeat; background-position: center; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; color: var(--primary-dark); }

        .bonsai-info { padding: 10px; }
        .bonsai-name { font-weight: 700; font-size: 0.9rem; }
        .bonsai-origin-tag { font-size: 0.65rem; font-weight: 700; background: var(--primary-dark); color: white; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 5px; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg2); height: 72px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(0,0,0,0.08); z-index: 900; }
        .nav-btn { color: #B0ADA0; background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
        .nav-btn.active { color: var(--primary-deep); }

        .screen { display: none; }
        .screen.active { display: block; }
        .card { background: var(--card-bg2); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow-card); }
        .form-group { margin-bottom: 14px; }
        label { display: block; color: var(--secondary-text); font-weight: 700; font-size: 0.75rem; margin-bottom: 5px; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 11px; border: 1.5px solid #D5D2C0; border-radius: 9px; font-family: var(--font-sans); }

        .btn-action { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: 700; color: white; cursor: pointer; margin-top: 10px; }
        .bg-blue { background: var(--primary-deep); }
        .bg-green { background: var(--success); }
        .bg-red { background: var(--danger); }

        /* CROPPING UI */
        #crop-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 2000; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }
        #crop-canvas { max-width: 100%; max-height: 60vh; border: 2px solid white; cursor: crosshair; }
        .crop-controls { margin-top: 20px; display: flex; gap: 10px; width: 100%; }

        #toast { visibility: hidden; position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--primary-deep); color: #fff; padding: 12px 20px; border-radius: 10px; z-index: 3000; }
        #toast.show { visibility: visible; }
    </style>
</head>
<body>

<div id="crop-modal">
    <h3 style="color:white; margin-bottom:10px;">Recadrer la photo</h3>
    <p style="color:#ccc; font-size:0.8rem; margin-bottom:10px;">Faites glisser pour définir la zone</p>
    <canvas id="crop-canvas"></canvas>
    <div class="crop-controls">
        <button class="btn-action bg-red" onclick="closeCrop()">Annuler</button>
        <button class="btn-action bg-green" onclick="confirmCrop()">Valider le recadrage</button>
    </div>
</div>

<div id="screen-list" class="screen active">
    <div class="app-header">
        <div class="header-top">
            <span class="header-title">Bonsai Do</span>
            <span id="bonsai-count" style="font-size:0.8rem;">0 arbres</span>
        </div>
    </div>
    <div class="main-container">
        <button class="btn-action bg-blue" onclick="openEditor(null)" style="margin-bottom:15px;"><i class="fa-solid fa-plus"></i> Ajouter un arbre</button>
        <div id="list-container">Chargement...</div>
    </div>
</div>

<div id="screen-edit" class="screen">
    <div class="app-header">
        <button onclick="nav('list')" style="background:none;border:none;color:white;"><i class="fa-solid fa-chevron-left"></i></button>
    </div>
    <div class="main-container">
        <div class="card">
            <label>Photo</label>
            <input type="file" accept="image/*" id="file-input" onchange="startCrop(this)">
            <div id="edit-photo-preview" style="width:100%; height:180px; background:#eee; margin-top:10px; border-radius:10px; background-size:contain; background-repeat:no-repeat; background-position:center; display:none;"></div>
        </div>
        <div class="card">
            <div class="form-group"><label>Surnom</label><input type="text" id="edit-name"></div>
            <div class="form-group"><label>Espèce</label><input type="text" id="edit-species"></div>
            <div class="form-group">
                <label>Origine</label>
                <select id="edit-origin">
                    <option value="Pépinière">Pépinière 🪴</option>
                    <option value="Prélèvement">Prélèvement 🌲</option>
                </select>
            </div>
        </div>
        <button class="btn-action bg-green" onclick="saveBonsai()">Enregistrer</button>
        <button class="btn-action bg-red" id="btn-delete" style="display:none;" onclick="deleteBonsai()">Supprimer</button>
    </div>
</div>

<div class="bottom-nav">
    <button class="nav-btn active" onclick="nav('list')"><i class="fa-solid fa-tree"></i><span>Arbres</span></button>
    <button class="nav-btn" onclick="showToast('Agenda bientôt prêt')"><i class="fa-solid fa-calendar"></i><span>Agenda</span></button>
</div>

<div id="toast"></div>

<script>
const DB_NAME = 'BonsaiCropDB';
const STORE_NAME = 'trees';
let bonsais = [];
let currentUid = null;
let currentPhotoBase64 = null;

// Gestion de la DB
const dbApi = {
    open: () => new Promise(res => {
        const r = indexedDB.open(DB_NAME, 1);
        r.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME, { keyPath: 'uid' });
        r.onsuccess = e => res(e.target.result);
    }),
    getAll: async () => {
        const db = await dbApi.open();
        return new Promise(res => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const req = tx.objectStore(STORE_NAME).getAll();
            req.onsuccess = () => res(req.result);
        });
    },
    put: async item => {
        const db = await dbApi.open();
        db.transaction(STORE_NAME, 'readwrite').objectStore(STORE_NAME).put(item);
    },
    delete: async uid => {
        const db = await dbApi.open();
        db.transaction(STORE_NAME, 'readwrite').objectStore(STORE_NAME).delete(uid);
    }
};

// --- LOGIQUE DE RECADRAGE ---
let tempImg = new Image();
let cropStart = null;
let cropEnd = null;
const canvas = document.getElementById('crop-canvas');
const ctx = canvas.getContext('2d');

function startCrop(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => {
            tempImg.onload = () => {
                document.getElementById('crop-modal').style.display = 'flex';
                // Redimensionnement canvas pour l'affichage
                canvas.width = tempImg.width;
                canvas.height = tempImg.height;
                ctx.drawImage(tempImg, 0, 0);
            };
            tempImg.src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
    }
}

canvas.onmousedown = (e) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    cropStart = { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
};

canvas.onmousemove = (e) => {
    if (!cropStart) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    cropEnd = { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
    
    // Redessiner
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(tempImg, 0, 0);
    ctx.strokeStyle = "red";
    ctx.lineWidth = 5;
    ctx.strokeRect(cropStart.x, cropStart.y, cropEnd.x - cropStart.x, cropEnd.y - cropStart.y);
};

canvas.onmouseup = () => {
    if (!cropEnd) return;
    // Zone définie
};

function confirmCrop() {
    if (!cropStart || !cropEnd) return alert("Veuillez sélectionner une zone");
    
    const w = Math.abs(cropEnd.x - cropStart.x);
    const h = Math.abs(cropEnd.y - cropStart.y);
    const x = Math.min(cropStart.x, cropEnd.x);
    const y = Math.min(cropStart.y, cropEnd.y);

    const finalCanvas = document.createElement('canvas');
    finalCanvas.width = 600; // Largeur standard pour l'app
    finalCanvas.height = (h / w) * 600;
    
    const fCtx = finalCanvas.getContext('2d');
    fCtx.drawImage(tempImg, x, y, w, h, 0, 0, finalCanvas.width, finalCanvas.height);
    
    currentPhotoBase64 = finalCanvas.toDataURL('image/jpeg', 0.8);
    document.getElementById('edit-photo-preview').style.backgroundImage = `url('${currentPhotoBase64}')`;
    document.getElementById('edit-photo-preview').style.display = 'block';
    closeCrop();
}

function closeCrop() {
    document.getElementById('crop-modal').style.display = 'none';
    cropStart = null; cropEnd = null;
    document.getElementById('file-input').value = "";
}

// --- APP CORE ---
async function refresh() {
    bonsais = await dbApi.getAll();
    const container = document.getElementById('list-container');
    container.innerHTML = '';
    document.getElementById('bonsai-count').innerText = bonsais.length + ' arbres';
    bonsais.forEach(b => {
        const div = document.createElement('div');
        div.className = 'bonsai-item';
        div.onclick = () => openEditor(b.uid);
        const photo = b.photo ? `style="background-image:url('${b.photo}')"` : '';
        div.innerHTML = `
            <div class="thumb-icon" ${photo}>${b.photo ? '' : '<i class="fa-solid fa-tree"></i>'}</div>
            <div class="bonsai-info">
                <div class="bonsai-name">${b.name || 'Sans nom'}</div>
                <div class="bonsai-origin-tag">${b.origin || 'Pépinière'}</div>
            </div>`;
        container.appendChild(div);
    });
}

function openEditor(uid) {
    currentUid = uid; currentPhotoBase64 = null;
    document.getElementById('edit-photo-preview').style.display = 'none';
    document.querySelectorAll('#screen-edit input').forEach(i => i.value = '');
    document.getElementById('btn-delete').style.display = uid ? 'block' : 'none';
    if (uid) {
        const b = bonsais.find(x => x.uid === uid);
        document.getElementById('edit-name').value = b.name;
        document.getElementById('edit-species').value = b.species || '';
        document.getElementById('edit-origin').value = b.origin || 'Pépinière';
        if (b.photo) {
            currentPhotoBase64 = b.photo;
            document.getElementById('edit-photo-preview').style.backgroundImage = `url('${b.photo}')`;
            document.getElementById('edit-photo-preview').style.display = 'block';
        }
    }
    nav('edit');
}

async function saveBonsai() {
    const name = document.getElementById('edit-name').value;
    if (!name) return showToast('Nom requis');
    await dbApi.put({
        uid: currentUid || Date.now(),
        name: name,
        species: document.getElementById('edit-species').value,
        origin: document.getElementById('edit-origin').value,
        photo: currentPhotoBase64
    });
    await refresh(); nav('list'); showToast('Sauvegardé');
}

async function deleteBonsai() {
    await dbApi.delete(currentUid);
    await refresh(); nav('list');
}

function nav(s) {
    document.querySelectorAll('.screen').forEach(scr => scr.classList.remove('active'));
    document.getElementById('screen-' + s).classList.add('active');
}

function showToast(m) {
    const t = document.getElementById('toast');
    t.innerText = m; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}

window.onload = refresh;
</script>
</body>
</html>
