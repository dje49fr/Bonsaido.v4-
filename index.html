<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BONSAI-EN · PRO</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F4F0E8; --card: #FDFAF4; --card2: #F0EBE1;
  --ink: #1C1814; --ink2: #3A342C; --ink3: #7A6E62; --ink4: #B0A89C;
  --moss: #3D6B47; --moss-l: #5A8E65; --moss-pale: #D4E4D8;
  --clay: #9B5B3A; --clay-pale: #F0DDD2;
  --gold: #B8942A; --gold-pale: #F5EDD0;
  --red: #C0392B; --red-pale: #FDECEA;
  --border: rgba(28,24,20,0.10); --border2: rgba(28,24,20,0.06);
  --shadow: 0 2px 16px rgba(28,24,20,0.07);
  --r: 18px; --r-sm: 12px;
  --font: 'DM Sans', sans-serif;
  --serif: 'Noto Serif JP', serif;
  --ease: cubic-bezier(0.4,0,0.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:82px;overflow-x:hidden}
.screen{display:none}
.screen.active{display:block;animation:fadeUp .28s var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* HEADER */
.app-header{background:rgba(253,250,244,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:14px 18px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200}
.logo{display:flex;align-items:center;gap:10px}
.logo-box{width:34px;height:34px;background:var(--ink);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:1.1rem;color:var(--bg);font-weight:700;flex-shrink:0}
.logo-text .name{font-family:var(--serif);font-size:1.15rem;font-weight:700;letter-spacing:.05em}
.logo-text .sub{font-size:.58rem;color:var(--ink3);letter-spacing:.22em;text-transform:uppercase;margin-top:1px}
.header-r{display:flex;align-items:center;gap:8px}
.count-pill{background:var(--ink);color:var(--bg);padding:4px 11px;border-radius:20px;font-size:.68rem;font-weight:600;letter-spacing:.06em}
.icon-btn{width:34px;height:34px;border-radius:50%;background:var(--card2);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:.85rem;transition:.18s var(--ease)}
.icon-btn:active{transform:scale(.9)}

/* SEARCH */
.search-wrap{padding:12px 16px 4px}
.search-bar{display:flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 14px;gap:10px;box-shadow:var(--shadow);transition:.18s var(--ease)}
.search-bar:focus-within{border-color:var(--moss-l);box-shadow:0 0 0 3px var(--moss-pale),var(--shadow)}
.search-bar i{color:var(--ink4);font-size:.85rem}
.search-bar input{flex:1;border:none;outline:none;font-family:var(--font);font-size:.9rem;background:transparent;color:var(--ink)}
.search-bar input::placeholder{color:var(--ink4)}

/* CHIPS */
.filter-row{display:flex;gap:7px;padding:10px 16px 6px;overflow-x:auto;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:5px 12px;border-radius:20px;font-size:.73rem;font-weight:500;border:1px solid var(--border);background:var(--card);color:var(--ink3);cursor:pointer;transition:.16s var(--ease);white-space:nowrap}
.chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:active{transform:scale(.94)}

/* URGENCY */
.urgency-banner{margin:8px 16px 0;background:var(--red-pale);border:1px solid rgba(192,57,43,.2);border-radius:var(--r-sm);padding:11px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.16s var(--ease)}
.urgency-banner:active{transform:scale(.98)}
.urg-dot{width:8px;height:8px;border-radius:50%;background:var(--red);flex-shrink:0;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
.urg-text{flex:1}
.urg-title{font-size:.78rem;font-weight:600;color:var(--red)}
.urg-sub{font-size:.7rem;color:var(--ink3);margin-top:1px}
.urg-arrow{color:var(--ink4);font-size:.75rem}

/* SECTION HEAD */
.sec-head{padding:16px 16px 8px;display:flex;align-items:baseline;justify-content:space-between}
.sec-title{font-family:var(--serif);font-size:.95rem;font-weight:600}
.sec-link{font-size:.73rem;color:var(--moss);font-weight:500;cursor:pointer}

/* GRID CARDS */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 4px}
.bonsai-card{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:.2s var(--ease);box-shadow:var(--shadow)}
.bonsai-card:active{transform:scale(.97);box-shadow:none}
.card-img{height:120px;display:flex;align-items:center;justify-content:center;font-size:3.2rem;position:relative;overflow:hidden}
.card-img::after{content:'';position:absolute;bottom:0;left:0;right:0;height:40px;background:linear-gradient(transparent,var(--card))}
.card-body{padding:10px 12px 12px}
.card-name{font-family:var(--serif);font-size:.88rem;font-weight:600;margin-bottom:2px;line-height:1.3}
.card-species{font-size:.68rem;color:var(--ink3);font-style:italic;margin-bottom:8px}
.card-tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:.6rem;padding:2px 7px;border-radius:10px;font-weight:500}
.tag.moss{background:var(--moss-pale);color:var(--moss)}
.tag.gold{background:var(--gold-pale);color:var(--gold)}
.tag.red{background:var(--red-pale);color:var(--red)}
.card-next{margin-top:8px;padding-top:8px;border-top:1px solid var(--border2);font-size:.67rem;color:var(--ink4);display:flex;align-items:center;gap:5px}
.card-next i{font-size:.6rem}
.card-next.soon{color:var(--red)}

/* LIST CARDS */
.list-view{padding:0 16px 4px;display:flex;flex-direction:column;gap:10px}
.list-card{background:var(--card);border:1px solid var(--border2);border-radius:var(--r-sm);padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.2s var(--ease);box-shadow:var(--shadow)}
.list-card:active{transform:scale(.98)}
.list-emoji{font-size:2.2rem;flex-shrink:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--card2);border-radius:10px}
.list-info{flex:1;min-width:0}
.list-name{font-family:var(--serif);font-size:.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-species{font-size:.7rem;color:var(--ink3);font-style:italic;margin-top:1px}
.list-meta{display:flex;gap:6px;margin-top:5px}
.list-r{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.list-age{font-size:.68rem;color:var(--ink4)}
.status-dot{width:8px;height:8px;border-radius:50%}
.status-dot.ok{background:var(--moss-l)}
.status-dot.warn{background:var(--gold)}
.status-dot.alert{background:var(--red)}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(253,250,244,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);height:72px;display:flex;justify-content:space-around;align-items:center;border-top:1px solid var(--border);z-index:200}
.nav-btn{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink4);font-size:.58rem;font-family:var(--font);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;padding:6px 20px;border-radius:12px;transition:.16s var(--ease)}
.nav-btn i{font-size:1.1rem}
.nav-btn.active{color:var(--ink)}
.nav-btn.active i{color:var(--moss)}
.nav-btn:active{transform:scale(.9)}

/* DETAIL */
.detail-header{background:rgba(253,250,244,.94);backdrop-filter:blur(18px);padding:14px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200}
.back-btn{background:none;border:none;cursor:pointer;color:var(--ink2);font-size:1rem;padding:4px;transition:.16s var(--ease)}
.back-btn:active{transform:scale(.9)}
.detail-header-title{font-family:var(--serif);font-size:1rem;font-weight:600;flex:1}
.detail-hero{height:220px;display:flex;align-items:center;justify-content:center;font-size:8rem;position:relative}
.detail-hero-overlay{position:absolute;inset:0;background:linear-gradient(transparent 60%,var(--bg))}
.detail-body{padding:0 16px 20px}
.detail-name{font-family:var(--serif);font-size:1.6rem;font-weight:700;margin-top:-8px;position:relative;z-index:1}
.detail-species{font-size:.82rem;color:var(--ink3);font-style:italic;margin-top:3px;margin-bottom:14px}
.detail-chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.info-tile{background:var(--card);border:1px solid var(--border2);border-radius:var(--r-sm);padding:12px 14px}
.info-tile-label{font-size:.65rem;color:var(--ink4);text-transform:uppercase;letter-spacing:.12em;margin-bottom:4px}
.info-tile-val{font-size:.95rem;font-weight:600}
.info-tile-val.moss{color:var(--moss)}
.info-tile-val.red{color:var(--red)}
.section-card{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.section-card-title{font-family:var(--serif);font-size:.88rem;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.task-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border2)}
.task-item:last-child{border-bottom:none}
.task-check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:.16s var(--ease)}
.task-check.done{background:var(--moss);border-color:var(--moss);color:#fff;font-size:.7rem}
.task-label{flex:1;font-size:.83rem}
.task-label.done{text-decoration:line-through;color:var(--ink4)}
.task-date{font-size:.68rem;color:var(--ink4)}
.task-date.soon{color:var(--red);font-weight:600}
.note-text{font-size:.83rem;color:var(--ink2);line-height:1.6}
.cta-btn{width:100%;padding:14px;border-radius:var(--r-sm);border:none;cursor:pointer;font-family:var(--font);font-size:.9rem;font-weight:600;margin-bottom:10px;transition:.18s var(--ease);display:flex;align-items:center;justify-content:center;gap:8px}
.cta-btn:active{transform:scale(.97)}
.cta-primary{background:var(--ink);color:var(--bg)}
.cta-secondary{background:var(--card2);color:var(--ink2);border:1px solid var(--border)}

/* CALENDAR */
.cal-month{padding:16px 18px 8px;display:flex;align-items:center;justify-content:space-between}
.cal-month-name{font-family:var(--serif);font-size:1.1rem;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 12px}
.cal-day-name{text-align:center;font-size:.62rem;color:var(--ink4);padding:4px 0;font-weight:500;text-transform:uppercase;letter-spacing:.08em}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;font-size:.78rem;cursor:pointer;position:relative;transition:.14s var(--ease)}
.cal-day:active{transform:scale(.88)}
.cal-day.today{background:var(--ink);color:var(--bg);font-weight:700}
.cal-day.has-task::after{content:'';position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--moss)}
.cal-day.has-task.today::after{background:var(--bg)}
.cal-day.has-urgent::after{background:var(--red)}
.cal-day.other-month{color:var(--ink4)}
.cal-events{padding:12px 16px}
.event-item{background:var(--card);border:1px solid var(--border2);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.event-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.event-info{flex:1}
.event-title{font-size:.85rem;font-weight:600}
.event-sub{font-size:.7rem;color:var(--ink3);margin-top:2px}
.event-time{font-size:.7rem;color:var(--ink4);flex-shrink:0}

/* TIPS */
.tips-hero{padding:20px 18px;background:linear-gradient(135deg,var(--ink) 0%,#2C3E24 100%);color:var(--bg)}
.tips-hero h2{font-family:var(--serif);font-size:1.4rem;font-weight:700;margin-bottom:4px}
.tips-hero p{font-size:.8rem;opacity:.65;line-height:1.5}
.tip-card{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);margin:0 16px 10px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:.2s var(--ease)}
.tip-card:active{transform:scale(.98)}
.tip-card-head{padding:14px 16px 10px;display:flex;align-items:flex-start;gap:12px}
.tip-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.tip-cat{font-size:.62rem;text-transform:uppercase;letter-spacing:.14em;font-weight:600;margin-bottom:3px}
.tip-title{font-family:var(--serif);font-size:.9rem;font-weight:600;line-height:1.35}
.tip-preview{padding:0 16px 14px;font-size:.78rem;color:var(--ink3);line-height:1.55}
.tip-full{display:none;padding:12px 16px 14px;font-size:.82rem;color:var(--ink2);line-height:1.65;border-top:1px solid var(--border2)}
.tip-card.expanded .tip-full{display:block}

/* EMPTY */
.empty{text-align:center;padding:48px 32px;color:var(--ink4)}
.empty i{font-size:2.5rem;margin-bottom:12px;display:block}
.empty p{font-size:.85rem;line-height:1.6}

/* FAB */
.fab{position:fixed;bottom:88px;right:18px;width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--bg);border:none;cursor:pointer;font-size:1.3rem;box-shadow:0 4px 20px rgba(28,24,20,.22);display:flex;align-items:center;justify-content:center;transition:.2s var(--ease);z-index:150}
.fab:active{transform:scale(.9)}

/* TOAST */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:.82rem;font-weight:500;z-index:999;opacity:0;transition:.24s var(--ease);pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- SCREEN: LISTE -->
<div id="screen-list" class="screen active">
  <header class="app-header">
    <div class="logo">
      <div class="logo-box">盆</div>
      <div class="logo-text">
        <div class="name">BONSAI-EN</div>
        <div class="sub">Collection Pro</div>
      </div>
    </div>
    <div class="header-r">
      <div class="count-pill" id="bonsai-count">6 arbres</div>
      <button class="icon-btn" onclick="toggleView()"><i class="fa-solid fa-grip" id="view-icon"></i></button>
    </div>
  </header>

  <div class="search-wrap">
    <div class="search-bar">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="search-input" placeholder="Espèce, nom, style…" oninput="renderList()">
    </div>
  </div>

  <div class="filter-row">
    <button class="chip active" onclick="setFilter(this,'all')">Tous</button>
    <button class="chip" onclick="setFilter(this,'arros')">🚿 Arrosage</button>
    <button class="chip" onclick="setFilter(this,'rempot')">🪴 Rempotage</button>
    <button class="chip" onclick="setFilter(this,'taille')">✂️ Taille</button>
    <button class="chip" onclick="setFilter(this,'ligature')">🪢 Ligature</button>
  </div>

  <div class="urgency-banner" onclick="showScreen('calendar')">
    <div class="urg-dot"></div>
    <div class="urg-text">
      <div class="urg-title">2 tâches urgentes aujourd'hui</div>
      <div class="urg-sub">Arrosage Juniperus · Engrais Érable</div>
    </div>
    <i class="fa-solid fa-chevron-right urg-arrow"></i>
  </div>

  <div class="sec-head">
    <div class="sec-title">Ma collection</div>
    <div class="sec-link" onclick="showToast('Ajout bientôt disponible !')">+ Ajouter</div>
  </div>

  <div id="list-container"></div>
</div>

<!-- SCREEN: DETAIL -->
<div id="screen-detail" class="screen">
  <header class="app-header detail-header">
    <button class="back-btn" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i></button>
    <div class="detail-header-title" id="detail-header-title">Détail</div>
    <button class="icon-btn" onclick="showToast('Options bientôt disponibles')"><i class="fa-solid fa-ellipsis"></i></button>
  </header>
  <div id="detail-body"></div>
</div>

<!-- SCREEN: CALENDRIER -->
<div id="screen-calendar" class="screen">
  <header class="app-header">
    <div class="logo">
      <div class="logo-box">暦</div>
      <div class="logo-text">
        <div class="name">CALENDRIER</div>
        <div class="sub">Entretien</div>
      </div>
    </div>
  </header>
  <div class="cal-month">
    <div class="cal-month-name" id="cal-month-name"></div>
    <div style="display:flex;gap:6px">
      <button class="icon-btn" onclick="prevMonth()"><i class="fa-solid fa-chevron-left"></i></button>
      <button class="icon-btn" onclick="nextMonth()"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
  </div>
  <div class="cal-grid" id="cal-grid"></div>
  <div class="sec-head"><div class="sec-title">Tâches du mois</div></div>
  <div id="cal-events"></div>
</div>

<!-- SCREEN: CONSEILS -->
<div id="screen-tips" class="screen">
  <div class="tips-hero">
    <h2>Conseils de saison</h2>
    <p>Printemps 2026 · Mises en valeur pour votre collection</p>
  </div>
  <div class="sec-head" style="padding-top:14px"><div class="sec-title">Guides essentiels</div></div>
  <div id="tips-container"></div>
</div>

<!-- NAV -->
<nav class="bottom-nav">
  <button class="nav-btn active" id="nav-home" onclick="showScreen('list')">
    <i class="fa-solid fa-seedling"></i><span>Collection</span>
  </button>
  <button class="nav-btn" id="nav-calendar" onclick="showScreen('calendar')">
    <i class="fa-regular fa-calendar"></i><span>Calendrier</span>
  </button>
  <button class="nav-btn" id="nav-tips" onclick="showScreen('tips')">
    <i class="fa-regular fa-lightbulb"></i><span>Conseils</span>
  </button>
</nav>

<button class="fab" id="fab" onclick="showToast('Ajout bientôt disponible !')">
  <i class="fa-solid fa-plus"></i>
</button>

<div class="toast" id="toast"></div>

  { id:3, emoji:'🌸', name:'Hanako', species:'Prunus serrulata', style:'Shakan', age:'15 ans', pot:'Céladon hexagonal', lastWater:"Aujourd'hui", nextWater:'Après-demain', waterDays:2, lastFeed:'12 avr.', nextFeed:'26 avr.', lastRepot:'Mars 2023', nextRepot:'Mars 2026', height:'44 cm', trunk:'6.1 cm', status:'alert', statusLabel:'Rempotage urgent', notes:'Floraison exceptionnelle. Rempotage immédiat recommandé, les racines sont visibles sous le pot.', tags:['Floraison','Extérieur'], tasks:[{l:'Rempotage urgent',d:'Cette semaine',done:false,u:true},{l:'Arrosage',d:'20 avr.',done:false,u:false},{l:'Taille post-floraison',d:'Mai',done:false,u:false}] },
  { id:4, emoji:'🌿', name:'Ryoku', species:'Ficus retusa', style:'Neagari', age:'6 ans', pot:'Cascade rond', lastWater:'Hier', nextWater:'Dans 2j', waterDays:3, lastFeed:'8 avr.', nextFeed:'22 avr.', lastRepot:'Jan. 2025', nextRepot:'Jan. 2027', height:'31 cm', trunk:'3.4 cm', status:'ok', statusLabel:'En bonne santé', notes:'Intérieur lumineux. Croissance vigoureuse. Tailler les nouvelles pousses régulièrement pour conserver la silhouette.', tags:['Tropical','Intérieur'], tasks:[{l:'Arrosage',d:'20 avr.',done:false,u:false},{l:'Taille des pousses',d:'25 avr.',done:false,u:false}] },

];

const TIPS = [
  { icon:'💧', bg:'#EBF4FF', cat:'Arrosage', catColor:'#2980B9', title:"L'arrosage au printemps : fréquence et technique", preview:"Le printemps est la saison la plus délicate. Les températures montent mais les nuits restent fraîches.", full:"Au printemps, la reprise végétative augmente considérablement les besoins en eau. Vérifiez l'humidité du substrat matin et soir en enfonçant légèrement le doigt.\n\nUtilisez de préférence de l'eau de pluie ou décalcifiée, surtout pour les azalées. Arrosez en deux temps : humidifiez le substrat, attendez quelques minutes, puis arrosez jusqu'à ce que l'eau s'écoule par les trous de drainage." },
  { icon:'✂️', bg:'#EAFAF1', cat:'Taille', catColor:'#27AE60', title:'Taille de printemps : pinçage et structuration', preview:"Le moment idéal est après l'apparition des premières feuilles mais avant la lignification des nouvelles pousses.", full:"La taille de printemps a deux objectifs : le pinçage pour limiter la croissance et favoriser la ramification fine, et la taille de structure pour remodeler la silhouette.\n\nPour le pinçage, supprimez les nouvelles pousses en laissant 2 à 3 paires de feuilles. Utilisez des ciseaux affûtés. Pour les pins, attendez que les chandelles aient atteint leur longueur maximale avant de les couper de moitié." },
  { icon:'🪴', bg:'#FEF9E7', cat:'Rempotage', catColor:'#D4AC0D', title:'Guide du rempotage : substrat et timing parfait', preview:"Le rempotage est l'intervention la plus stressante pour l'arbre. Un timing précis et un substrat adapté sont essentiels.", full:"Rempotez au moment de la reprise végétative, quand les premiers bourgeons gonflent — généralement entre mi-mars et mi-avril selon les espèces.\n\nSubstrat idéal : 60% d'akadama, 20% de ponce volcanique, 20% d'écorce fine de pin. Après rempotage, placez l'arbre à l'abri du vent et du soleil direct pendant 2-3 semaines. Aucun engrais pendant un mois." },
  { icon:'🌱', bg:'#F4ECF7', cat:'Engrais', catColor:'#8E44AD', title:'Fertilisation printanière : les bons dosages', preview:'Le printemps marque la reprise des apports nutritifs après la pause hivernale.', full:"En début de printemps, privilégiez des engrais riches en azote (N) pour stimuler la croissance. Un ratio NPK 10-5-5 est approprié.\n\nLa méthode japonaise utilise des boulettes d'engrais organique (biogold) posées en surface. Elles libèrent les nutriments progressivement à chaque arrosage. Comptez 2 à 4 boulettes selon la taille du pot." },
  { icon:'🌡️', bg:'#FDEDEC', cat:'Protection', catColor:'#C0392B', title:'Gérer les gelées tardives du printemps', preview:"Les gelées d'avril restent une menace réelle pour les bonsaïs en reprise végétative.", full:"Les températures négatives après la reprise végétative sont particulièrement dangereuses. Rentrez vos bonsaïs sensibles dès que les nuits descendent sous 5°C.\n\nSi des pousses ont gelé, ne les taillez pas immédiatement. Attendez 1-2 semaines pour identifier la zone morte et couper dans le bois sain." }
];

// ── STATE ──
let currentFilter = 'all';
let isGridView = true;
let calYear = 2026, calMonth = 3;

// ── INIT ──
document.addEventListener('DOMContentLoaded', () => {
  renderList();
  renderCalendar();
  renderTips();
});

// ── NAVIGATION ──
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  ['home','calendar','tips'].forEach(n => document.getElementById('nav-'+n) && document.getElementById('nav-'+n).classList.remove('active'));
  const map = {list:'screen-list', calendar:'screen-calendar', tips:'screen-tips'};
  const navMap = {list:'nav-home', calendar:'nav-calendar', tips:'nav-tips'};
  document.getElementById(map[name]).classList.add('active');
  if (document.getElementById(navMap[name])) document.getElementById(navMap[name]).classList.add('active');
  document.getElementById('fab').style.display = name === 'list' ? 'flex' : 'none';
}

function showDetail(id) {
  const b = BONSAIS.find(x => x.id === id);
  document.getElementById('detail-header-title').textContent = b.name;
  document.getElementById('detail-body').innerHTML = buildDetail(b);
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-detail').classList.add('active');
  document.getElementById('fab').style.display = 'none';
  window.scrollTo(0,0);
}

function goBack() {
  document.getElementById('screen-detail').classList.remove('active');
  document.getElementById('screen-list').classList.add('active');
  document.getElementById('fab').style.display = 'flex';
  document.getElementById('nav-home').classList.add('active');
}

// ── LIST ──
function renderList() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const data = BONSAIS.filter(b => {
    const ms = !q || b.name.toLowerCase().includes(q) || b.species.toLowerCase().includes(q) || b.tags.some(t => t.toLowerCase().includes(q));
    const mf = currentFilter === 'all' || b.tasks.some(t => t.l.toLowerCase().includes(currentFilter));
    return ms && mf;
  });
  const c = document.getElementById('list-container');
  if (!data.length) { c.innerHTML = '<div class="empty"><i class="fa-solid fa-tree"></i><p>Aucun bonsaï trouvé.</p></div>'; return; }
  if (isGridView) {
    c.innerHTML = '<div class="grid">' + data.map(b => {
      const t = b.tasks.find(x => !x.done);
      return `<div class="bonsai-card" onclick="showDetail(${b.id})">
        <div class="card-img" style="background:linear-gradient(160deg,${sBg(b.status)},var(--card))">${b.emoji}</div>
        <div class="card-body">
          <div class="card-name">${b.name}</div>
          <div class="card-species">${b.species}</div>
          <div class="card-tags">
            ${b.tags.map(tg=>`<span class="tag moss">${tg}</span>`).join('')}
            <span class="tag ${b.status==='alert'?'red':b.status==='warn'?'gold':'moss'}">${b.statusLabel}</span>
          </div>
          ${t?`<div class="card-next ${t.u?'soon':''}"><i class="fa-regular fa-clock"></i>${t.l} · ${t.d}</div>`:''}
        </div></div>`;
    }).join('') + '</div>';
  } else {
    c.innerHTML = '<div class="list-view">' + data.map(b =>
      `<div class="list-card" onclick="showDetail(${b.id})">
        <div class="list-emoji">${b.emoji}</div>
        <div class="list-info">
          <div class="list-name">${b.name}</div>
          <div class="list-species">${b.species}</div>
          <div class="list-meta">${b.tags.map(tg=>`<span class="tag moss">${tg}</span>`).join('')}</div>
        </div>
        <div class="list-r"><div class="status-dot ${b.status}"></div><div class="list-age">${b.age}</div></div>
      </div>`
    ).join('') + '</div>';
  }
}

function sBg(s){ return s==='alert'?'var(--red-pale)':s==='warn'?'var(--gold-pale)':'var(--moss-pale)'; }

function toggleView() {
  isGridView = !isGridView;
  document.getElementById('view-icon').className = isGridView ? 'fa-solid fa-grip' : 'fa-solid fa-list';
  renderList();
}

function setFilter(el, val) {
  currentFilter = val;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderList();
}

// ── DETAIL ──
function buildDetail(b) {
  return `
  <div class="detail-hero" style="background:linear-gradient(160deg,${sBg(b.status)},var(--card))">
    <span style="position:relative;z-index:1">${b.emoji}</span>
    <div class="detail-hero-overlay"></div>
  </div>
  <div class="detail-body">
    <div class="detail-name">${b.name}</div>
    <div class="detail-species">${b.species}</div>
    <div class="detail-chips">
      ${b.tags.map(t=>`<span class="tag moss">${t}</span>`).join('')}
      <span class="tag ${b.status==='alert'?'red':b.status==='warn'?'gold':'moss'}">${b.statusLabel}</span>
    </div>
    <div class="info-grid">
      <div class="info-tile"><div class="info-tile-label">Style</div><div class="info-tile-val">${b.style}</div></div>
      <div class="info-tile"><div class="info-tile-label">Âge</div><div class="info-tile-val">${b.age}</div></div>
      <div class="info-tile"><div class="info-tile-label">Hauteur</div><div class="info-tile-val">${b.height}</div></div>
      <div class="info-tile"><div class="info-tile-label">Tronc</div><div class="info-tile-val">${b.trunk}</div></div>
      <div class="info-tile"><div class="info-tile-label">Prochain arrosage</div><div class="info-tile-val ${b.nextWater==="Aujourd'hui"?'red':'moss'}">${b.nextWater}</div></div>
      <div class="info-tile"><div class="info-tile-label">Prochain engrais</div><div class="info-tile-val">${b.nextFeed}</div></div>
    </div>
    <div class="section-card">
      <div class="section-card-title"><i class="fa-regular fa-circle-check" style="color:var(--moss)"></i> Tâches</div>
      ${b.tasks.map((t,i)=>`
        <div class="task-item">
          <div class="task-check ${t.done?'done':''}" onclick="toggleTask(${b.id},${i})">${t.done?'<i class="fa-solid fa-check"></i>':''}</div>
          <div class="task-label ${t.done?'done':''}">${t.l}</div>
          <div class="task-date ${t.u&&!t.done?'soon':''}">${t.d}</div>
        </div>`).join('')}
    </div>
    <div class="section-card">
      <div class="section-card-title"><i class="fa-regular fa-note-sticky" style="color:var(--gold)"></i> Notes</div>
      <div class="note-text">${b.notes}</div>
    </div>
    <div class="section-card">
      <div class="section-card-title"><i class="fa-solid fa-vase" style="color:var(--clay)"></i> Entretien</div>
      <div class="info-grid" style="margin-bottom:0">
        <div class="info-tile"><div class="info-tile-label">Contenant</div><div class="info-tile-val" style="font-size:.78rem">${b.pot}</div></div>
        <div class="info-tile"><div class="info-tile-label">Dernier rempotage</div><div class="info-tile-val" style="font-size:.78rem">${b.lastRepot}</div></div>
      </div>
    </div>
    <button class="cta-btn cta-primary" onclick="markWatered(${b.id})"><i class="fa-solid fa-droplet"></i> Enregistrer l'arrosage</button>
    <button class="cta-btn cta-secondary" onclick="showToast('Partage bientôt disponible !')"><i class="fa-solid fa-share-nodes"></i> Partager cette fiche</button>
  </div>`;
}

function toggleTask(bid, i) {
  const b = BONSAIS.find(x => x.id === bid);
  b.tasks[i].done = !b.tasks[i].done;
  document.getElementById('detail-body').innerHTML = buildDetail(b);
  showToast(b.tasks[i].done ? '✓ Tâche accomplie !' : 'Tâche remise en cours');
}

function markWatered(id) {
  const b = BONSAIS.find(x => x.id === id);
  b.lastWater = "Aujourd'hui";
  b.nextWater = `Dans ${b.waterDays}j`;
  b.status = 'ok'; b.statusLabel = 'Arrosage effectué';
  document.getElementById('detail-body').innerHTML = buildDetail(b);
  showToast('💧 Arrosage enregistré !');
}

// ── CALENDAR ──
const MONTHS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

function renderCalendar() {
  document.getElementById('cal-month-name').textContent = `${MONTHS[calMonth]} ${calYear}`;
  const today = new Date();
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const offset = firstDay === 0 ? 6 : firstDay - 1;
  const days = new Date(calYear, calMonth + 1, 0).getDate();
  const prevDays = new Date(calYear, calMonth, 0).getDate();
  const urgentDays = new Set([18,19,20]);
  const taskDays = new Set([18,19,20,22,24,25,26,29]);

  let html = ['L','M','M','J','V','S','D'].map(d => `<div class="cal-day-name">${d}</div>`).join('');
  for (let i = offset-1; i >= 0; i--) html += `<div class="cal-day other-month">${prevDays-i}</div>`;
  for (let d = 1; d <= days; d++) {
    const isToday = d === today.getDate() && calMonth === today.getMonth() && calYear === today.getFullYear();
    let cls = 'cal-day';
    if (isToday) cls += ' today';
    if (urgentDays.has(d)) cls += ' has-urgent';
    else if (taskDays.has(d)) cls += ' has-task';
    html += `<div class="${cls}" onclick="showToast('${d} ${MONTHS[calMonth]}')">${d}</div>`;
  }
  const rem = (offset + days) % 7;
  if (rem) for (let d = 1; d <= 7 - rem; d++) html += `<div class="cal-day other-month">${d}</div>`;
  document.getElementById('cal-grid').innerHTML = html;

  const events = [
    {c:'var(--red)',title:'Arrosage Juniperus · Shōichi',sub:'Urgent — 2 jours sans arrosage',day:18},
    {c:'var(--gold)',title:'Engrais azoté · Momiji',sub:'Apport de printemps prévu',day:19},
    {c:'var(--clay)',title:'Rempotage · Hanako',sub:'Racines visibles, urgent',day:20},
    {c:'var(--moss)',title:'Vérifier ligature · Shōichi',sub:'Branche droite, inspection',day:22},
    {c:'var(--moss)',title:'Engrais · Ryoku',sub:'Apport mensuel',day:22},
    {c:'var(--gold)',title:'Arrosage · Ganju',sub:'Selon météo',day:24},
  ];
  document.getElementById('cal-events').innerHTML = events.map(e =>
    `<div class="event-item">
      <div class="event-dot" style="background:${e.c}"></div>
      <div class="event-info"><div class="event-title">${e.title}</div><div class="event-sub">${e.sub}</div></div>
      <div class="event-time">${e.day} ${MONTHS[calMonth].slice(0,3)}.</div>
    </div>`).join('');
}

function prevMonth() { calMonth--; if (calMonth<0){calMonth=11;calYear--;} renderCalendar(); }
function nextMonth() { calMonth++; if (calMonth>11){calMonth=0;calYear++;} renderCalendar(); }

// ── TIPS ──
function renderTips() {
  document.getElementById('tips-container').innerHTML = TIPS.map((t,i) =>
    `<div class="tip-card" id="tip-${i}" onclick="document.getElementById('tip-${i}').classList.toggle('expanded')">
      <div class="tip-card-head">
        <div class="tip-icon" style="background:${t.bg}">${t.icon}</div>
        <div>
          <div class="tip-cat" style="color:${t.catColor}">${t.cat}</div>
          <div class="tip-title">${t.title}</div>
        </div>
      </div>
      <div class="tip-preview">${t.preview}</div>
      <div class="tip-full">${t.full.split('\n\n').map(p=>`<p style="margin-bottom:10px">${p}</p>`).join('')}</div>
    </div>`).join('');
}

// ── TOAST ──
let toastT;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), 2200);
}
</script>
</body>
</html>
