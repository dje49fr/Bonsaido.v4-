<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BONSAI-EN · PRO</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ... Tes styles existants ... */
:root {
  --bg: #F2EFE8; --bg2: #FFFFFF; --card: #FFFFFF; --card2: #F7F4EE;
  --green: #4A7A56; --green-light: #E6EFE8; --green-text: #3A6A46;
  --btn-dark: #2E2A24; --btn-darker: #1A1712; --border: #E2DDD4;
  --text: #1A1814; --text-sec: #6A6258; --text-dim: #ABA49B;
  --urgent: #C0392B; --radius: 16px; --radius-sm: 12px;
  --shadow-sm: 0 1px 8px rgba(0,0,0,0.05);
  --font: 'DM Sans', sans-serif; --font-serif: 'Noto Serif JP', serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--text); padding-bottom: 76px; }
.screen { display: none; }
.screen.active { display: block; }

/* Styles de navigation et header */
.home-header { background: #fff; padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
.home-logo { display: flex; align-items: center; gap: 10px; }
.home-logo-icon { font-size: 2.2rem; color: #C0392B; }
.home-logo-text { font-family: var(--font-serif); font-size: 1.9rem; font-weight: 700; }
.search-wrap { padding: 10px 14px; }
.search-bar { display: flex; align-items: center; background: #fff; border-radius: 12px; padding: 11px 14px; gap: 10px; border: 1px solid var(--border); }
.search-bar input { flex: 1; border: none; outline: none; font-family: var(--font); }
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; height: 72px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--border); }
.nav-btn { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-dim); font-size: 0.6rem; }
.nav-btn.active { color: var(--text); }
</style>
</head>
<body>

<div id="screen-list" class="screen active">
    <div class="home-header">
        <div class="home-logo">
            <span class="home-logo-icon"><i class="fa-solid fa-torii-gate"></i></span>
            <div class="home-logo-text">BONSAI-EN</div>
        </div>
        <div class="home-count" id="bonsai-count">0 arbres</div>
    </div>

    <div class="search-wrap">
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="search-input" placeholder="Rechercher espèce, nom...">
        </div>
    </div>

    <div id="list-container" style="padding: 14px; text-align: center; color: var(--text-dim);">
        Chargement de la collection...
    </div>
</div>

<nav class="bottom-nav">
    <button class="nav-btn active"><i class="fa-solid fa-house"></i><span>Accueil</span></button>
    <button class="nav-btn"><i class="fa-regular fa-calendar"></i><span>Calendrier</span></button>
    <button class="nav-btn"><i class="fa-regular fa-lightbulb"></i><span>Conseils</span></button>
</nav>

<script>
    // Logique de base pour tester l'affichage
    document.addEventListener('DOMContentLoaded', () => {
        console.log("Interface BONSAI-EN chargée.");
    });
</script>

</body>
</html>
