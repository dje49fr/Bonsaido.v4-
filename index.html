<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BONSAI DO - PRO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #B0D3E5; --primary-dark: #507A92; --primary-deep: #2E5F78;
            --bg: #D5D1C0; --card-bg2: #FDFBF4; --text: #2C2A23;
            --secondary-text: #6E6C62; --danger: #C0392B; --success: #27AE60;
            --radius: 14px; --shadow-card: 0 2px 12px rgba(0,0,0,0.08);
            --font-serif: 'Noto Serif JP', serif; --font-sans: 'DM Sans', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-sans); background: var(--bg); padding-bottom: 80px; color: var(--text); min-height: 100vh; }

        .app-header { background: linear-gradient(135deg, var(--primary-deep), var(--primary-dark)); color: #fff; padding: 14px 16px; position: sticky; top: 0; z-index: 100; box-shadow: 0 3px 16px rgba(0,0,0,0.1); }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .header-title { 
            font-family: var(--font-serif); 
            font-size: 1.5rem; 
            font-weight: 600; 
            text-transform: uppercase; /* TITRE EN MAJUSCULES */
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-title i { color: #FFD580; } /* Couleur dorée pour la porte */

        .main-container { padding: 14px; max-width: 800px; margin: 0 auto; }
        #list-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 12px; }
        
        .bonsai-item { background: var(--card-bg2); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-card); cursor: pointer; display: flex; flex-direction: column; }
        .thumb-icon { width: 100%; height: 150px; background-color: #E8E4D8; background-size: contain; background-repeat: no-repeat; background-position: center; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; color: var(--primary-dark); }

        .bonsai-info { padding: 10px; }
        .bonsai-name { font-weight: 700; font-size: 0.9rem; }
        .bonsai-origin-tag { font-size: 0.65rem; font-weight: 700; background: var(--primary-dark); color: white; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 5px; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg2); height: 72px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(0,0,0,0.08); z-index: 900; }
        .nav-btn { color: #B0ADA0; background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; text-decoration: none;}
        .nav-btn.active { color: var(--primary-deep); }

        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.2s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .card { background: var(--card-bg2); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow-card); }
        .form-group { margin-bottom: 14px; }
        label { display: block; color: var(--secondary-text); font-weight: 700; font-size: 0.75rem; margin-bottom: 5px; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 11px; border: 1.5px solid #D5D2C0; border-radius: 9px; font-family: var(--font-sans); }

        .btn-action { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: 700; color: white; cursor: pointer; margin-top: 10px; font-size: 1rem;}
        .bg-blue { background: var(--primary-deep); }
        .bg-green { background: var(--success); }
        .bg-red { background: var(--danger); }

        /* --- CROP UI V3 (Masque Mobile Agrandi X2) --- */
        #crop-screen {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 2000; flex-direction: column;
        }
        
        #crop-viewport {
            flex: 1; width: 100%; position: relative; overflow: auto;
            display: flex; align-items: center; justify-content: center;
            -webkit-overflow-scrolling: touch;
        }
        
        #crop-image {
            max-width: 100%; max-height: 100%;
            display: block;
            will-change: transform;
        }
        
        #crop-mask-movable {
            position: absolute;
            width: 500px; /* TAILLE AGRANDIE X2 */
            height: 500px; /* TAILLE AGRANDIE X2 */
            border: 2px solid #fff;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
            cursor: move;
            z-index: 2010;
            left: 10px; top: 10px;
            touch-action: none;
        }
        
        .crop-controls {
            height: 80px; background: rgba(0,0,0,0.9); display: flex; gap: 10px; padding: 10px 20px;
            border-top: 1px solid rgba(255,255,255,0.2); z-index: 2020;
        }

        #toast { visibility: hidden; position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--primary-deep); color: #fff; padding: 12px 20px; border-radius: 10px; z-index: 3000; font-weight: bold;}
        #toast.show { visibility: visible; }
    </style>
</head>
<body>

<div id="crop-screen">
    <div id="crop-viewport">
        <img id="crop-image" alt="Image à recadrer">
        <div id="crop-mask-movable"></div>
    </div>
    <div class="crop-controls">
        <button class="btn-action bg-red" onclick="closeCrop()"><i class="fa-solid fa-xmark"></i> Annuler</button>
        <button class="btn-action bg-green" onclick="confirmCrop()"><i class="fa-solid fa-check"></i> Valider</button>
    </div>
</div>

<div id="screen-list" class="screen active">
    <div class="app-header">
        <div class="header-top">
            <span class="header-title">
                <i class="fa-solid fa-torii-gate"></i> BONSAI DO
            </span>
            <span id="bonsai-count" style="font-size:0.8rem; background:rgba(255,255,255,0.2); padding:3px 8px; border-radius:10px;">0 arbres</span>
        </div>
    </div>
    <div class="main-container">
        <button class="btn-action bg-blue" onclick="openEditor(null)" style="margin-bottom:15px; border-radius:12px; box-shadow: 0 4px 10px rgba(46,95,120,0.2);"><i class="fa-solid fa-plus"></i> Ajouter un sujet</button>
        <div id="list-container">Chargement...</div>
    </div>
</div>

<div id="screen-edit" class="screen">
    <div class="app-header">
        <div class="header-top">
            <button onclick="nav('list')" style="background:none;border:none;color:white;font-size:1.2rem;"><i class="fa-solid fa-chevron-left"></i> Retour</button>
            <span style="font-family:var(--font-serif); font-weight:600;">ÉDITEUR</span>
            <div style="width:50px;"></div>
        </div>
    </div>
    <div class="main-container">
        <div class="card">
            <label>Photo</label>
            <input type="file" accept="image/*" id="file-input" onchange="startCrop(this)" style="font-size:0.8rem;">
            <div id="edit-photo-preview" style="width:100%; height:180px; background:#eee; margin-top:10px; border-radius:10px; background-size:contain; background-repeat:no-repeat; background-position:center; display:none; border: 1px solid rgba(0,0,0,0.1);"></div>
        </div>
        <div class="card">
            <div class="form-group"><label>Surnom / ID</label><input type="text" id="edit-name" placeholder="Ex: Grand Orme"></div>
            <div class="form-group"><label>Espèce</label><input type="text" id="edit-species" placeholder="Ex: Ulmus Parvifolia"></div>
            <div class="form-group">
                <label>Origine</label>
                <select id="edit-origin">
                    <option value="Pépinière">Pépinière 🪴</option>
                    <option value="Prélèvement">Prélèvement 🌲</option>
                </select>
            </div>
        </div>
        <button class="btn-action bg-green" onclick="saveBonsai()"><i class="fa-solid fa-floppy-disk"></i> Enregistrer</button>
        <button class="btn-action bg-red" id="btn-delete" style="display:none;" onclick="deleteBonsai()"><i class="fa-solid fa-trash"></i> Supprimer cet arbre</button>
    </div>
</div>

<div class="bottom-nav">
    <button class="nav-btn active" id="nav-list" onclick="nav('list')"><i class="fa-solid fa-tree"></i><span>Collection</span></button>
    <button class="nav-btn" onclick="showToast('Section Agenda bientôt active')"><i class="fa-solid fa-calendar-day"></i><span>Agenda</span></button>
</div>

<div id="toast"></div>

<script>
// --- DB CORE ---
const DB_NAME = 'BonsaiProV4DB'; const STORE_NAME = 'trees'; let bonsais = []; let currentUid = null; let currentPhotoBase64 = null;
const dbApi = {
    open: () => new Promise(res => { const r = indexedDB.open(DB_NAME, 1); r.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME, { keyPath: 'uid' }); r.onsuccess = e => res(e.target.result); }),
    getAll: async () => { const db = await dbApi.open(); return new Promise(res => { const tx = db.transaction(STORE_NAME, 'readonly'); const req = tx.objectStore(STORE_NAME).getAll(); req.onsuccess = () => res(req.result); }); },
    put: async item => { const db = await dbApi.open(); db.transaction(STORE_NAME, 'readwrite').objectStore(STORE_NAME).put(item); },
    delete: async uid => { const db = await dbApi.open(); db.transaction(STORE_NAME, 'readwrite').objectStore(STORE_NAME).delete(uid); }
};

// --- LOGIQUE RECADRAGE MOBILE ---
const imgEl = document.getElementById('crop-image');
const maskEl = document.getElementById('crop-mask-movable');
const viewportEl = document.getElementById('crop-viewport');
const CROP_SIZE = 500; // TAILLE 500px

let isDraggingMask = false;
let maskStartPos = { x: 0, y: 0 };
let maskCurrentPos = { x: 20, y: 20 };

function startCrop(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => {
            imgEl.onload = () => {
                document.getElementById('crop-screen').style.display = 'flex';
                maskCurrentPos.x = (viewportEl.clientWidth - CROP_SIZE) / 2;
                maskCurrentPos.y = (viewportEl.clientHeight - CROP_SIZE) / 2;
                updateMaskPosition();
            };
            imgEl.src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
    }
}

function updateMaskPosition() {
    maskEl.style.left = maskCurrentPos.x + 'px';
    maskEl.style.top = maskCurrentPos.y + 'px';
}

maskEl.onpointerdown = (e) => {
    isDraggingMask = true;
    maskStartPos.x = e.clientX - maskCurrentPos.x;
    maskStartPos.y = e.clientY - maskCurrentPos.y;
    maskEl.setPointerCapture(e.pointerId);
    e.stopPropagation();
};

maskEl.onpointermove = (e) => {
    if (!isDraggingMask) return;
    maskCurrentPos.x = e.clientX - maskStartPos.x;
    maskCurrentPos.y = e.clientY - maskStartPos.y;
    updateMaskPosition();
    e.stopPropagation();
};

maskEl.onpointerup = (e) => {
    isDraggingMask = false;
    maskEl.releasePointerCapture(e.pointerId);
};

function confirmCrop() {
    const finalCanvas = document.createElement('canvas');
    finalCanvas.width = 600;
    finalCanvas.height = 600;
    const ctx = finalCanvas.getContext('2d');
    const imgRect = imgEl.getBoundingClientRect();
    const maskRect = maskEl.getBoundingClientRect();
    const ratioX = imgEl.naturalWidth / imgRect.width;
    const ratioY = imgEl.naturalHeight / imgRect.height;
    const sx = (maskRect.left - imgRect.left) * ratioX;
    const sy = (maskRect.top - imgRect.top) * ratioY;
    const sw = CROP_SIZE * ratioX;
    const sh = CROP_SIZE * ratioY;
    ctx.drawImage(imgEl, sx, sy, sw, sh, 0, 0, 600, 600);
    currentPhotoBase64 = finalCanvas.toDataURL('image/jpeg', 0.85);
    document.getElementById('edit-photo-preview').style.backgroundImage = `url('${currentPhotoBase64}')`;
    document.getElementById('edit-photo-preview').style.display = 'block';
    closeCrop();
    showToast('Photo recadrée');
}

function closeCrop() {
    document.getElementById('crop-screen').style.display = 'none';
    document.getElementById('file-input').value = "";
}

// --- APP FUNCTIONS ---
async function refresh() {
    bonsais = await dbApi.getAll();
    const container = document.getElementById('list-container');
    container.innerHTML = '';
    document.getElementById('bonsai-count').innerText = bonsais.length + ' sujet(s)';
    bonsais.forEach(b => {
        const div = document.createElement('div'); div.className = 'bonsai-item'; div.onclick = () => openEditor(b.uid);
        const photo = b.photo ? `style="background-image:url('${b.photo}')"` : '';
        div.innerHTML = `
            <div class="thumb-icon" ${photo}>${b.photo ? '' : '<i class="fa-solid fa-tree" style="opacity:0.2;"></i>'}</div>
            <div class="bonsai-info">
                <div class="bonsai-name">${b.name || 'SANS NOM'}</div>
                <div class="bonsai-origin-tag">${b.origin || 'PÉPINIÈRE'}</div>
            </div>`;
        container.appendChild(div);
    });
}

function openEditor(uid) {
    currentUid = uid; currentPhotoBase64 = null;
    document.getElementById('edit-photo-preview').style.display = 'none';
    document.querySelectorAll('#screen-edit input').forEach(i => i.value = '');
    document.getElementById('btn-delete').style.display = uid ? 'block' : 'none';
    if (uid) {
        const b = bonsais.find(x => x.uid === uid);
        document.getElementById('edit-name').value = b.name;
        document.getElementById('edit-species').value = b.species || '';
        document.getElementById('edit-origin').value = b.origin || 'Pépinière';
        if (b.photo) { currentPhotoBase64 = b.photo; document.getElementById('edit-photo-preview').style.backgroundImage = `url('${b.photo}')`; document.getElementById('edit-photo-preview').style.display = 'block'; }
    }
    nav('edit');
}

async function saveBonsai() {
    const name = document.getElementById('edit-name').value;
    if (!name) return showToast('Nom ou ID requis');
    await dbApi.put({ uid: currentUid || Date.now(), name: name, species: document.getElementById('edit-species').value, origin: document.getElementById('edit-origin').value, photo: currentPhotoBase64 });
    await refresh(); nav('list'); showToast('Arbre enregistré');
}

async function deleteBonsai() {
    await dbApi.delete(currentUid);
    await refresh(); nav('list'); showToast('Supprimé');
}

function nav(s) {
    document.querySelectorAll('.screen').forEach(scr => scr.classList.remove('active'));
    document.getElementById('screen-' + s).classList.add('active');
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    if(s === 'list') document.getElementById('nav-list').classList.add('active');
}

function showToast(m) {
    const t = document.getElementById('toast');
    t.innerText = m; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
}

window.onload = refresh;
</script>
</body>
</html>
